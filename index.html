<h1>Lions GM Simulator</h1>

<input id="playerName" placeholder="Player Name">
<input id="playerPosition" placeholder="Position">
<input id="playerAge" placeholder="Age">
<input id="playerOverall" placeholder="Overall">
<input id="salaryCap" placeholder="Salary Cap">

<select id="actionSelect">
  <option value="addPlayerBtn">Add Player</option>
  <option value="removePlayerBtn">Remove Player</option>
  <option value="clearRosterBtn">Clear Roster</option>
</select>

<select id="actionArrange">
  <option value="sortAge">Sort by Age</option>
  <option value="sortOverall">Sort by Overall</option>
  <option value="sortSalary">Sort by Salary</option>
</select>

<select id="playerUnit">
  <option value="Offense">Offense</option>
  <option value="Defense">Defense</option>
  <option value="Special Teams">Special Teams</option>
</select>

<input id="removeReason" placeholder="Reason for removal">

<button id="runActionBtn">Run Action</button>
<button id="sortBtn">Sort Roster</button>
<button id="editPositionBtn">Edit Position</button>
<button id="editAgeBtn">Edit Age</button>
<button id="editOverallBtn">Edit Overall</button>
<button id="editSalaryBtn"> Edit Salary</button>

<h2 id="averageOverallRating"> Average Overall Rating: x </h2>
<h2 id="averageAges"> Average Ages: x</h2>
<h2 id="remainingSalaryCap"> Remaining Salary Cap: x </h2>
<h2>Active Players:</h2>
<div id="rosterDisplay"></div>

<h2>Removed Players:</h2>
<div id="removedPlayersDisplay"></div>

<h2>Traded Players:</h2>
<div id="tradedPlayersDisplay"></div>

<input id="tradeReturn" placeholder="Received in return">
<input id="tradeReason" placeholder="Reason for trade">

<select id="tradeTeam">
  <option value="Chicago Bears">Chicago Bears</option>
  <option value="Green Bay Packers">Green Bay Packers</option>
  <option value="Minnesota Vikings">Minnesota Vikings</option>
</select>

<button id="tradePlayerBtn">Trade Player</button>


<script src="script.js"></script>
